# Both feature flavors are checked: `uniffi` and `wasm-web` gate most of the
# source, so a change that compiles under one often fails under the other.

variables:
  GIT_DEPTH: 100
  GIT_STRATEGY: clone
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # Not `.cargo/`: that is committed and holds audit.toml.
  CARGO_HOME: $CI_PROJECT_DIR/.cargo-home

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH
    # Avoid a duplicate branch pipeline when an MR is already open.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^release\//
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: never

stages:
  - check
  - test
  - audit

default:
  tags:
    - privileged
  image:
    # Shared with bark-ffi-bindings, which already builds this crate for wasm32.
    # TODO: pin by digest, as that repo notes for the same image:
    #   skopeo inspect --format '{{.Digest}}' docker://registry.2nd.dev/build-bark-ffi-bindings:1
    name: registry.2nd.dev/build-bark-ffi-bindings:1
    pull_policy: if-not-present
  interruptible: true
  before_script:
    - sudo chown -R nixuser:nixbld "$CI_PROJECT_DIR" || true
    - git config --global --add safe.directory $CI_PROJECT_DIR
    - rustc --version && cargo --version
  cache:
    # Keyed on the lockfile, so a dependency change gets a cold cache.
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo-home/registry/index/
      - .cargo-home/registry/cache/
      - target/

clippy-uniffi:
  stage: check
  needs: []
  script:
    - cargo clippy --locked --no-default-features --features uniffi --all-targets -- -D warnings

clippy-wasm:
  stage: check
  needs: []
  script:
    - rustup target add wasm32-unknown-unknown
    - cargo clippy --locked --no-default-features --features wasm-web --target wasm32-unknown-unknown -- -D warnings

# Clippy does not codegen; this links the cdylib/staticlib the bindings use.
build-uniffi:
  stage: test
  needs: []
  script:
    - cargo build --locked --no-default-features --features uniffi

test-uniffi:
  stage: test
  needs: []
  script:
    - cargo test --locked --no-default-features --features uniffi

# Blocks deliberately: accept an advisory in .cargo/audit.toml rather than
# letting the job fail. Advisories only for now; add --deny unmaintained
# --deny yanked once the tree is clean against them.
cargo-audit:
  stage: audit
  needs: []
  cache: []
  script:
    # TODO: pre-install in the image and drop this.
    - command -v cargo-audit >/dev/null 2>&1 || cargo install --locked cargo-audit --version 0.22.2
    - cargo audit --file Cargo.lock
