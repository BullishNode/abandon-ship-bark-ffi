stages:
  - build
  - release

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  RUST_BACKTRACE: "1"

# Cache Cargo dependencies
.rust_cache:
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/
      - target/

# Build and create release (manual trigger)
build-and-release:swift:
  stage: build
  extends: .rust_cache
  tags:
    - macos # Requires macOS runner with Xcode
  when: manual
  before_script:
    - rustup --version
    - rustc --version
    - cargo --version
    - xcodebuild -version
    # Git configuration for committing
    - git config user.email "ci@gitlab.com"
    - git config user.name "GitLab CI"
  script:
    # Determine version from variable or default
    - |
      if [ -z "$RELEASE_VERSION" ]; then
        echo "ERROR: RELEASE_VERSION variable must be set (e.g., v1.0.0)"
        exit 1
      fi
    - echo "Building release $RELEASE_VERSION"
    # Build the XCFramework
    - cd bindings/swift
    - ./build-swift.sh

    # Compute checksum
    - CHECKSUM=$(swift package compute-checksum build/xcframework/BarkFFI.xcframework.zip)
    - echo "Computed checksum:" $CHECKSUM

    # Update Package.swift with version and checksum
    - cd ../..
    - |
      sed -i '' "s|url: \".*\"|url: \"https://gitlab.com/ark-bitcoin/bark-ffi/-/releases/${RELEASE_VERSION}/downloads/BarkFFI.xcframework.zip\"|" Package.swift
    - |
      sed -i '' "s/checksum: \".*\"/checksum: \"$CHECKSUM\"/" Package.swift

    # Commit changes
    - git add Package.swift bindings/swift/Sources/
    - git commit -m "Release Swift bindings ${RELEASE_VERSION}" || echo "No changes to commit"

    # Create and push tag
    - git tag "$RELEASE_VERSION"
    - git push https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git HEAD:$CI_COMMIT_REF_NAME
    - git push https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git "$RELEASE_VERSION"

    # Upload to Package Registry
    - |
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file bindings/swift/build/xcframework/BarkFFI.xcframework.zip \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/bark-swift/${RELEASE_VERSION}/BarkFFI.xcframework.zip"

  artifacts:
    paths:
      - bindings/swift/build/xcframework/BarkFFI.xcframework.zip
      - bindings/swift/Sources/
    expire_in: 1 week
  only:
    - master
    - main

# Create GitLab release after tag is pushed
release:swift:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    description: |
      ## Bark Swift Bindings ${CI_COMMIT_TAG}

      Swift Package Manager bindings for Bark wallet.

      ### Installation

      Add to your `Package.swift`:
      ```swift
      dependencies: [
          .package(url: "https://gitlab.com/ark-bitcoin/bark-ffi.git", from: "${CI_COMMIT_TAG}")
      ]
      ```

      ### Changes

      See CHANGELOG.md for details.
    assets:
      links:
        - name: BarkFFI.xcframework.zip
          url: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/bark-swift/${CI_COMMIT_TAG}/BarkFFI.xcframework.zip
          link_type: package
  only:
    - tags
