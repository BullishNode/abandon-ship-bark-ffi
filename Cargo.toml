[package]
name = "bark-ffi"
version = "0.1.0-beta.9"
edition = "2021"
license = "MIT"
authors = ["Team Second <hello@second.tech>"]
repository = "https://gitlab.com/ark-bitcoin/bark"
description = "Language-agnostic Rust FFI implementation for Bark SDK bindings using UniFFI."

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "bark_ffi"

[dependencies.bark]
git = "https://gitlab.com/ark-bitcoin/bark"
package = "bark-wallet"
rev = "bark-0.1.0-beta.8"
default-features = false
features = [ "tls-webpki-roots", "onchain_bdk", "sqlite" ]

[dependencies.ark-lib]
git = "https://gitlab.com/ark-bitcoin/bark"
package = "ark-lib"
rev = "bark-0.1.0-beta.8"
default-features = false

[dependencies.bark-bitcoin-ext]
git = "https://gitlab.com/ark-bitcoin/bark"
package = "bark-bitcoin-ext"
rev = "bark-0.1.0-beta.8"
default-features = false

[dependencies]

# External dependencies
bitcoin = { version = "0.32.7", features = ["serde", "rand", "rand-std"] }
bip39 = { version = "2.0.0", features = ["rand"] }
lightning-invoice = { version = "0.34.0", features = ["std", "serde"] }
lnurl-rs = { version = "0.9.0", features = [
    "async",
    "async-https-rustls",
], default-features = false }
anyhow = { version = "1.0", features = ["backtrace"] }
thiserror = { version = "2.0.12" }
async-trait = "0.1.83"
tokio = { version = "1.35", default-features = false, features = [
    "rt-multi-thread",
    "fs",
    "signal",
] }
uniffi = { version = "=0.30.0", features = ["cli"] }
once_cell = "1.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
hex = "0.4"
chrono = "0.4"
# Add rusqlite directly with bundled feature for mobile platform support
rusqlite = { version = "0.31.0", features = ["bundled", "chrono"] }

[build-dependencies]
uniffi = { version = "=0.30.0", features = ["build"] }
