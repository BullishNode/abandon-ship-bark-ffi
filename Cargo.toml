[package]
name = "bark-ffi"
version = "0.1.0"
edition = "2021"
license = "CC0-1.0"
authors = ["Team Second <hello@second.tech>"]
repository = "https://gitlab.com/ark-bitcoin/bark"
description = "FFI bindings for bark wallet library"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "bark_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
# Bark dependencies from GitLab (using kumulynja fork with lazy_static 1.5.0 fix)
# Pinned to commit 7f625dff to avoid breaking API changes
bark = { git = "https://gitlab.com/ark-bitcoin/bark", package = "bark-wallet", rev = "7f625dffd598c23127f69590294ae7c397458d23", default-features = false, features = [
    "tls-webpki-roots",
    "onchain_bdk",
] }
ark-lib = { git = "https://gitlab.com/ark-bitcoin/bark", package = "ark-lib", rev = "7f625dffd598c23127f69590294ae7c397458d23", default-features = false }
bark-bitcoin-ext = { git = "https://gitlab.com/ark-bitcoin/bark", package = "bark-bitcoin-ext", rev = "7f625dffd598c23127f69590294ae7c397458d23", default-features = false }
# External dependencies
bitcoin = { version = "0.32", features = ["serde", "rand", "rand-std"] }
bip39 = { version = "2.0.0", features = ["rand"] }
lightning-invoice = { version = "0.33.2", features = ["std", "serde"] }
lnurl-rs = { version = "0.9.0", features = [
    "async",
    "async-https-rustls",
], default-features = false }
anyhow = { version = "1.0", features = ["backtrace"] }
thiserror = { version = "2.0.12" }
tokio = { version = "1.35", default-features = false, features = [
    "rt-multi-thread",
    "fs",
    "signal",
] }
uniffi = { version = "=0.30.0", features = ["cli"] }
camino = "1.2"
once_cell = "1.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
hex = "0.4"
# Add rusqlite directly with bundled feature for mobile platform support
rusqlite = { version = "0.31.0", features = ["bundled", "chrono"] }

[build-dependencies]
uniffi = { version = "=0.30.0", features = ["build"] }

[dependencies.uniffi-dart]
git = "https://github.com/kumulynja/uniffi-dart"
branch = "lazy-static-v1.4.0"

[build-dependencies.uniffi-dart]
git = "https://github.com/kumulynja/uniffi-dart"
branch = "lazy-static-v1.4.0"
features = ["build"]
