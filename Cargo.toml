[package]
name = "bark-ffi"
version = "0.21.0+bark-0.6.1.uniffi-0.31.1"
edition = "2021"
license = "MIT"
authors = ["Team Second <hello@second.tech>"]
repository = "https://gitlab.com/ark-bitcoin/bark"
description = "Language-agnostic Rust FFI implementation for Bark SDK bindings using UniFFI and WASM."

[lib]
name = "bark_ffi"
crate-type = ["lib", "staticlib", "cdylib"]

[features]
default = ["uniffi"]

uniffi = [
    "dep:uniffi",
    "dep:rusqlite",
    "dep:once_cell",
    "dep:tokio-util",
    "bark/sqlite",
    "bark/tls-webpki-roots",
    "bark/native",
    "bark/onchain-bdk",
    "tokio/rt-multi-thread",
    "tokio/signal",
    "tokio/fs",
]

wasm-web = [
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:serde-wasm-bindgen",
    "dep:tsify",
    "dep:tokio-util",
    "dep:gloo-timers",
    "ark/wasm-web",
    "bark/wasm-web",
    "bark/indexed-db",
    "bark/onchain-bdk",
    "bark-bitcoin-ext/wasm-web",
]

[dependencies.ark]
package = "ark-lib"
git = "https://gitlab.com/ark-bitcoin/bark"
rev = "bark-0.6.1"
default-features = false

[dependencies.bark]
package = "bark-wallet"
git = "https://gitlab.com/ark-bitcoin/bark"
rev = "bark-0.6.1"
default-features = false

[dependencies.bark-bitcoin-ext]
package = "bark-bitcoin-ext"
git = "https://gitlab.com/ark-bitcoin/bark"
rev = "bark-0.6.1"
default-features = false

[dependencies]

# Common (wasm-compatible) external deps
bitcoin = { version = "0.32.7", features = ["serde", "rand", "rand-std"] }
bip39 = { version = "2.0.0", features = ["rand"] }
lightning-invoice = { version = "0.34.0", features = ["std", "serde"] }
anyhow = { version = "1.0", features = ["backtrace"] }
thiserror = { version = "2.0.12" }
async-trait = "0.1.83"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
hex = "0.4"
chrono = "0.4"
log = "0.4"
tokio = { version = "1.35", default-features = false, features = ["sync", "macros"] }
futures-util = "0.3"

# uniffi-only optional deps
uniffi = { version = "=0.31.1", features = ["cli", "tokio"], optional = true }
rusqlite = { version = "0.31.0", features = ["bundled", "chrono"], optional = true }
once_cell = { version = "1.20", optional = true }
tokio-util = { version = "0.7.18", optional = true }

# wasm-only optional deps
wasm-bindgen = { version = "0.2.100", optional = true }
wasm-bindgen-futures = { version = "0.4.56", optional = true }
serde-wasm-bindgen = { version = "0.6.5", optional = true }
tsify = { version = "0.5.6", default-features = false, features = ["js"], optional = true }
gloo-timers = { version = "0.3", features = ["futures"], optional = true }
